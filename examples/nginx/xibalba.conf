# Xibalba behind nginx.
#
# nginx holds the certificate and passes every request to Xibalba, which
# listens on 127.0.0.1:8080. Put this file where your nginx reads site
# configurations (on Debian and Ubuntu: /etc/nginx/sites-available/, with a
# link in /etc/nginx/sites-enabled/), then change server_name and the two
# certificate paths.
#
# In xibalba.yaml, tell Xibalba to believe this nginx:
#
#   server:
#     trusted_proxies: ["127.0.0.1"]
#
# Tested with nginx 1.24 by test/webserver/check.py.

# Websockets: pass the client's wish to upgrade the connection on to Xibalba.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;    # add this line if the server has IPv6
    server_name www.example.org;

    ssl_certificate     /etc/ssl/certs/www.example.org.pem;
    ssl_certificate_key /etc/ssl/private/www.example.org.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The name of the site the visitor asked for.
        proxy_set_header Host $host;

        # The visitor's real address. nginx appends the address it saw to
        # whatever the client sent; Xibalba reads the list from the right and
        # so uses the address nginx saw, not one the client made up.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Whether the visitor came over HTTPS. Xibalba marks its cookie
        # "Secure" when this says https.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websockets.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
