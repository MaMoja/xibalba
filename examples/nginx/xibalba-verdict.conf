# nginx asks Xibalba about each request (auth_request).
#
# Here nginx talks to your website itself, as it does without Xibalba, and
# only asks Xibalba before each request whether it may pass. Xibalba listens
# on 127.0.0.1:8080 and has "verdict: enabled: true" in xibalba.yaml. Use
# this if you want to keep your nginx configuration as it is; otherwise
# xibalba.conf (everything passes through Xibalba) is simpler and does more.
# What differs is listed in docs/VERDICT.md.
#
# nginx needs the module ngx_http_auth_request_module. The packages of
# Debian, Ubuntu and nginx.org have it.
#
# In xibalba.yaml:
#
#   server:
#     trusted_proxies: ["127.0.0.1"]
#   verdict:
#     enabled: true
#
# Change server_name, the two certificate paths, and "location /" to what
# your site does today.
#
# Tested with nginx 1.24 by test/webserver/check.py.

# The method the visitor used. nginx turns it into GET when it fetches the
# page for a refused request; a "map" is worked out once per request, at
# the question, and keeps the answer.
map $request_method $xibalba_method {
    default $request_method;
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;    # add this line if the server has IPv6
    server_name www.example.org;

    ssl_certificate     /etc/ssl/certs/www.example.org.pem;
    ssl_certificate_key /etc/ssl/private/www.example.org.key;

    # Your website, as before, with two lines added.
    location / {
        # Ask Xibalba first. 2xx: pass. 401: the security check is due.
        # 403: refused.
        auth_request /.xibalba/check;
        # What Xibalba decided, for the page below.
        auth_request_set $xibalba_verdict $upstream_http_x_xibalba_verdict;
        auth_request_set $xibalba_retry   $upstream_http_retry_after;
        error_page 401 403 = /.xibalba/page;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Xibalba's own addresses: the visitor's answer to the security check
    # and the check's style sheet. Not checked themselves.
    location /.xibalba/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The question. "internal": only nginx itself can ask it.
    location = /.xibalba/check {
        internal;
        proxy_pass http://127.0.0.1:8080;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # What the visitor asked for.
        proxy_set_header X-Forwarded-Method $xibalba_method;
        proxy_set_header X-Forwarded-Uri    $request_uri;
        proxy_set_header X-Forwarded-Host   $host;
    }

    # The page for a visitor who may not pass: the security check, "request
    # blocked" or "too many requests". nginx cannot show the answer to the
    # question above, so it fetches the page here.
    location = /.xibalba/page {
        internal;
        proxy_pass http://127.0.0.1:8080;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Method $xibalba_method;
        proxy_set_header X-Forwarded-Uri    $request_uri;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Xibalba-Verdict     $xibalba_verdict;
        proxy_set_header X-Xibalba-Retry-After $xibalba_retry;
    }
}
