# Xibalba behind HAProxy.
#
# HAProxy holds the certificate and passes every request to Xibalba, which
# listens on 127.0.0.1:8080. Change the certificate path; HAProxy wants the
# certificate and its key in one file. Websockets pass through without
# further settings.
#
# In xibalba.yaml, tell Xibalba to believe this HAProxy:
#
#   server:
#     trusted_proxies: ["127.0.0.1"]
#
# Tested with HAProxy 2.8 by test/webserver/check.py.

defaults
    mode http
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Long-lived connections such as websockets.
    timeout tunnel  1h

frontend https
    bind :443 ssl crt /etc/haproxy/certs/www.example.org.pem

    # The visitor's real address. A header the client sent is removed first,
    # then HAProxy adds the address it saw.
    http-request del-header X-Forwarded-For
    option forwardfor

    # Whether the visitor came over HTTPS. Xibalba marks its cookie "Secure"
    # when this says https.
    http-request set-header X-Forwarded-Proto https

    default_backend xibalba

backend xibalba
    server xibalba 127.0.0.1:8080
