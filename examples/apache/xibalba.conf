# Xibalba behind Apache.
#
# Apache holds the certificate and passes every request to Xibalba, which
# listens on 127.0.0.1:8080. Put this file where your Apache reads site
# configurations (on Debian and Ubuntu: /etc/apache2/sites-available/, then
# "a2ensite xibalba"), and change ServerName and the two certificate paths.
#
# The modules it needs (on Debian and Ubuntu: "a2enmod ssl proxy proxy_http headers"):
#   mod_ssl, mod_proxy, mod_proxy_http, mod_headers
#
# In xibalba.yaml, tell Xibalba to believe this Apache:
#
#   server:
#     trusted_proxies: ["127.0.0.1"]
#
# Tested with Apache 2.4.58 by test/webserver/check.py.

<VirtualHost *:443>
    ServerName www.example.org

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/www.example.org.pem
    SSLCertificateKeyFile /etc/ssl/private/www.example.org.key

    # The name of the site the visitor asked for.
    ProxyPreserveHost On

    # Whether the visitor came over HTTPS. Xibalba marks its cookie "Secure"
    # when this says https. Set, not added: a value sent by the client is
    # replaced.
    RequestHeader set X-Forwarded-Proto "https"

    # The visitor's real address: Apache appends the address it saw to the
    # X-Forwarded-For header by itself. Xibalba reads the list from the right
    # and so uses the address Apache saw, not one the client made up.

    # Pass addresses on as the visitor wrote them, so Xibalba's rules see
    # what your website would have seen.
    AllowEncodedSlashes NoDecode

    # Everything goes to Xibalba. "upgrade=websocket" passes websockets
    # through (Apache 2.4.47 or later).
    ProxyPass        / http://127.0.0.1:8080/ nocanon upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
