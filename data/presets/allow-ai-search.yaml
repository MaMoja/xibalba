# Let through crawlers that build an index for AI answers which link back to
# their sources, but only when they really come from their operator.
rules:
  - name: preset.allow-ai-search
    match:
      crawler: {class: [ai-search], verified: true}
    action: allow
    # A verified crawler is who it says it is; the limits are not meant for it.
    exempt_from_limits: true
