operator: Microsoft
source: https://blogs.bing.com/webmaster/2012/08/31/how-to-verify-that-bingbot-is-bingbot/
checked: 2026-10-03
crawlers:
  - name: bingbot
    class: search-engine
    user_agent: bingbot
    purpose: Crawls for the Bing search engine.
    note: >-
      Verified by reverse DNS, as the cited article describes. Bing's current
      verification page could not be read when this entry was checked.
    verify:
      reverse_dns: [".search.msn.com"]
