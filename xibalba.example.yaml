# Xibalba configuration.
#
# Copy this file to xibalba.yaml and change what you need. Only upstream.url is
# required; every other value below is the default. The full reference is in
# docs/CONFIGURATION.md. Check a file without starting the server:
#
#   xibalba -check -config xibalba.yaml

# The website Xibalba protects.
upstream:
  # Where the website is reached from this machine. Required.
  url: "http://127.0.0.1:3000"
  # Send the visitor's Host header to the website (true) or the host from
  # url (false). Most websites need true to build correct links.
  preserve_host: true
  # How long connecting to the website may take.
  dial_timeout: 5s
  # How long the website may take to start answering a request.
  response_header_timeout: 60s

# The public side: where visitors, or the web server in front, connect.
server:
  # host:port to listen on. The default is reachable from this machine only;
  # put your web server or load balancer in front, or use "0.0.0.0:8080".
  listen: "127.0.0.1:8080"
  # Addresses and networks of reverse proxies in front of Xibalba, for example
  # ["127.0.0.1", "10.0.0.0/8"]. Only their X-Forwarded-For header is believed.
  # Leave empty if visitors reach Xibalba directly.
  trusted_proxies: []
  # How long a client may take to send its request headers.
  read_header_timeout: 10s
  # How long an unused keep-alive connection stays open.
  idle_timeout: 90s

# What happens to each request. Rules are explained in docs/RULES.md.
# With the values below nothing is blocked: every request is allowed.
rules:
  # true: evaluate and count every decision, but let every request through.
  # Use it to see what a rule set would do before switching it on.
  dry_run: false
  # What happens when no rule decides: allow, deny or challenge.
  default_action: allow
  # What happens to a request if evaluating it fails inside Xibalba:
  # allow keeps the website reachable, deny blocks until the problem is fixed.
  on_error: allow
  # Scores at which a request is challenged or denied, for example
  # [{weight: 10, action: challenge}, {weight: 20, action: deny}].
  thresholds: []
  # Rule files to import, relative to this file. They are evaluated after
  # the rules in list, in the order given.
  files: []
  # Rules written here are evaluated first, from top to bottom. Example:
  #
  #   list:
  #     - name: block-example-bot
  #       match:
  #         user_agent: {contains: "ExampleBot"}
  #       action: deny
  list: []

# The security check a client has to pass when a rule or threshold says
# "challenge". Explained in docs/CHALLENGE.md.
challenge:
  # How much the visitor's browser has to calculate: 8 (almost nothing) to 24
  # (very much). Each step up doubles the work. 18 takes a fraction of a second
  # on a computer and about a second on a phone.
  difficulty: 18
  # What visitors without JavaScript get:
  # button: they wait a few seconds and press a button.
  # deny:   they are told that JavaScript is needed.
  no_javascript: button
  # How long a visitor without JavaScript has to wait before the button counts.
  wait: 3s
  # How long a visitor has to finish the check before a new one is issued.
  challenge_lifetime: 5m
  # How long a visitor is not asked again after passing. 168h is one week.
  pass_lifetime: 168h
  # Tie a pass to the visitor's network as well as their browser, so it cannot
  # be copied to machines elsewhere.
  bind_network: true
  # File that holds the signing key, relative to this file. It is created at
  # the first start. Empty: a new key at every start, so every visitor is
  # checked again after a restart. Set this for real use, for example
  # "/var/lib/xibalba/xibalba.key".
  key_file: ""
  # Name of the cookie that holds the pass.
  cookie_name: "xibalba-pass"

# The pages Xibalba itself shows to visitors: the security check, "request
# blocked" and "website unavailable". They work as they are; adapt them here if you want.
pages:
  # Who runs the website, as it should read in a sentence, for example
  # "Stadt Musterhausen". Empty keeps "The operator of this website".
  operator: ""
  # How to reach you, shown on the block page, for example an e-mail address
  # or a telephone number. Empty shows no contact line.
  contact: ""
  # Language for visitors whose browser states none of the supported ones (de, en).
  default_language: de
  # Replace any text, per language. {operator} stands for the operator. Example:
  #
  #   texts:
  #     de:
  #       operator: "Die Stadt Musterhausen"
  #       blocked_text: "{operator} erlaubt keine automatisierten Abrufe."
  #     en:
  #       operator: "The City of Musterhausen"
  #
  # The text names are listed in docs/CONFIGURATION.md.
  texts: {}

# What Xibalba writes to its log (standard error).
log:
  # Lowest severity that is written: debug, info, warn, error.
  level: info
  # json: one JSON object per line, for log collectors.
  # text: key=value lines, easier to read by eye.
  format: json

# Internal listener for health checks. Keep it off the public internet.
ops:
  # host:port to listen on. The default is reachable from this machine only.
  listen: "127.0.0.1:9090"

# How long running requests get to finish when Xibalba is asked to stop.
shutdown_timeout: 10s
