# Xibalba configuration.
#
# Copy this file to xibalba.yaml and change what you need. Only upstream.url is
# required; every other value below is the default. The full reference is in
# docs/CONFIGURATION.md. Check a file without starting the server:
#
#   xibalba -check -config xibalba.yaml

# The website Xibalba protects.
upstream:
  # Where the website is reached from this machine. Required.
  url: "http://127.0.0.1:3000"
  # Send the visitor's Host header to the website (true) or the host from
  # url (false). Most websites need true to build correct links.
  preserve_host: true
  # How long connecting to the website may take.
  dial_timeout: 5s
  # How long the website may take to start answering a request.
  response_header_timeout: 60s

# The public side: where visitors, or the web server in front, connect.
server:
  # host:port to listen on. The default is reachable from this machine only;
  # put your web server or load balancer in front, or use "0.0.0.0:8080".
  listen: "127.0.0.1:8080"
  # Addresses and networks of reverse proxies in front of Xibalba, for example
  # ["127.0.0.1", "10.0.0.0/8"]. Only their X-Forwarded-For header is believed.
  # Leave empty if visitors reach Xibalba directly.
  trusted_proxies: []
  # How long a client may take to send its request headers.
  read_header_timeout: 10s
  # How long an unused keep-alive connection stays open.
  idle_timeout: 90s

# What happens to each request. Rules are explained in docs/RULES.md.
# With the values below nothing is blocked: every request is allowed.
rules:
  # true: evaluate and count every decision, but let every request through.
  # Use it to see what a rule set would do before switching it on.
  dry_run: false
  # What happens when no rule decides: allow, deny or challenge.
  default_action: allow
  # What happens to a request if evaluating it fails inside Xibalba:
  # allow keeps the website reachable, deny blocks until the problem is fixed.
  on_error: allow
  # Scores at which a request is challenged or denied, for example
  # [{weight: 10, action: challenge}, {weight: 20, action: deny}].
  thresholds: []
  # Ready-made rule groups that ship with Xibalba. They are evaluated after
  # the rules in list and before the rule files, in the order given:
  #
  #   keep-internet-working   let everyone read /.well-known/, robots.txt and
  #                           favicon.ico
  #   allow-feeds             let feed readers fetch news feeds
  #   allow-git-clients       let git fetch and push over HTTP
  #   allow-registry-clients  only in front of a container registry: let
  #                           image tools use the addresses under /v2/
  #   block-trapped           deny clients that followed the hidden trap
  #                           link (needs trap.enabled)
  #   block-fake-crawlers     deny requests that carry a crawler's name but do
  #                           not come from that crawler's operator
  #   block-ai-training       deny crawlers that collect pages for AI training
  #   block-archive-crawlers  deny crawlers that build public copies of the web
  #   allow-search-engines    let verified search engine crawlers through
  #   allow-ai-search         let verified AI search crawlers through
  #   allow-ai-user-fetch     let verified fetchers through that load a page
  #                           because a person asked an AI assistant about it
  #
  #   weigh-odd-browsers      add to the score of requests that say they are
  #                           a browser but do not behave like one; needs
  #                           thresholds
  #   challenge-browsers      check everything that says it is a browser;
  #                           list it last
  #
  # See docs/RULES.md ("Presets") and docs/CRAWLERS.md.
  presets: []
  # Rule files to import, relative to this file. They are evaluated after
  # the rules in list and the presets, in the order given.
  files: []
  # Rules written here are evaluated first, from top to bottom. Example:
  #
  #   list:
  #     - name: block-example-bot
  #       match:
  #         user_agent: {contains: "ExampleBot"}
  #       action: deny
  list: []

# How crawlers are recognised. Only used if a rule or preset has a crawler
# condition; without one, Xibalba makes no outgoing connection for this.
crawlers:
  # Use the crawler definitions that ship with Xibalba (docs/CRAWLERS.md
  # lists them). false: only the crawlers from "files" below are known.
  builtin: true
  # Download the address lists that crawler operators publish, so a genuine
  # crawler can be told from an impostor. The lists are fetched over HTTPS
  # from the operators (OpenAI, Google and so on); nothing about your
  # visitors is sent. false: crawlers that are verified by such a list are
  # never counted as genuine.
  refresh: true
  # How often the lists are downloaded again (1h to 720h).
  refresh_interval: 24h
  # Directory that keeps the downloaded lists across restarts, relative to
  # this file. Empty: memory only.
  cache_dir: ""
  # Your own crawler definition files, relative to this file. A crawler
  # defined there replaces the built-in one of the same name.
  files: []

# Countries. With a country database, rules can test which country a client's
# address is registered in (condition "country"). Xibalba ships no database:
# you choose one and keep it current, or let Xibalba download the free one of
# DB-IP. Read docs/COUNTRIES.md first: the free databases have licence terms.
countries:
  # The database file (.mmdb), relative to this file. Empty: no countries.
  # Works with DB-IP "IP to Country Lite" and MaxMind "GeoLite2 Country".
  # A newer file put in its place is picked up without a restart.
  database: ""
  # Download the database when the file is missing or a month old.
  download: false
  # Where to download from. {year} and {month} are filled in.
  download_url: "https://download.db-ip.com/free/dbip-country-lite-{year}-{month}.mmdb.gz"

# The trap: a link hidden in the pages Xibalba shows (the security check, the
# block page). No person can see or reach it; a program that collects every
# address in a page follows it. Whoever does is remembered, and the rule
# condition "trapped: true" and the preset "block-trapped" act on it.
# Off by default. See docs/TRAP.md.
trap:
  enabled: false
  # How long a client that followed the link is remembered (1m to 720h).
  remember: 24h
  # Answer the link with generated pages of meaningless syllables that link
  # to more such pages, to keep such a crawler busy with nothing. false: the
  # answer is a plain "not found".
  maze: false
  # How many clients are remembered at most.
  max_clients: 100000

# Request limits per client. Off by default. A client that sends more than a
# limit allows has to pass the security check, or is refused for a while.
# Not counted: the addresses under "exempt", and requests let through by a
# rule that says exempt_from_limits: true (the presets for verified crawlers
# do).
# See docs/LIMITS.md.
limits:
  enabled: false
  # What counts as one client:
  #   address: each IPv4 address on its own; for IPv6 the /64, which is one
  #            connection.
  #   network: neighbouring addresses together (IPv4 /24, IPv6 /48). Catches
  #            crawlers that spread over many addresses of one network, but
  #            also counts unrelated people of one network together.
  count_by: address
  # One to four limits. "per" is from 1s to 24h. action: challenge or deny.
  # With "challenge", a browser solves the check once and carries on; a
  # program that cannot solve it is stopped. Example with a daily limit:
  #
  #   windows:
  #     - {requests: 300, per: 1m, action: challenge}
  #     - {requests: 20000, per: 24h, action: deny}
  #
  # "count: pages" counts the different pages a client is given instead of
  # every request. A page is what your website answers as one (text/html);
  # images, scripts and data do not count. A person reads a few pages in ten
  # minutes, a crawler walks through hundreds. At most 500. Example:
  #
  #     - {requests: 60, per: 10m, action: challenge, count: pages}
  #
  # "deny_at" belongs to a challenge limit. A client that passed the check and
  # still sends more than this number within "per" is refused until it is
  # below it again. 0: never (a client that passed the check carries on).
  # Example: check from 300 a minute, refuse from 1200 a minute:
  #
  #     - {requests: 300, per: 1m, action: challenge, deny_at: 1200}
  windows:
    - requests: 300
      per: 1m
      action: challenge
      count: requests
      deny_at: 0
  # Addresses and networks that are never counted: your own office, your
  # monitoring, a partner's server. Example: ["192.0.2.0/24", "2001:db8::/32"]
  exempt: []
  # How many clients are tracked at most (memory: about 15 MB per 100000,
  # about 40 MB with a limit that counts pages).
  max_clients: 100000

# The security check a client has to pass when a rule or threshold says
# "challenge". Explained in docs/CHALLENGE.md.
challenge:
  # How much the visitor's browser has to calculate: 8 (almost nothing) to 24
  # (very much). Each step up doubles the work. 18 takes a fraction of a second
  # on a computer and about a second on a phone.
  difficulty: 18
  # What visitors without JavaScript get:
  # button: they wait a few seconds and press a button.
  # deny:   they are told that JavaScript is needed.
  no_javascript: button
  # How long a visitor without JavaScript has to wait before the button counts.
  wait: 3s
  # How long a visitor has to finish the check before a new one is issued.
  challenge_lifetime: 5m
  # How long a visitor is not asked again after passing. 168h is one week.
  pass_lifetime: 168h
  # Tie a pass to the visitor's network as well as their browser, so it cannot
  # be copied to machines elsewhere.
  bind_network: true
  # File that holds the signing key, relative to this file. It is created at
  # the first start. Empty: a new key at every start, so every visitor is
  # checked again after a restart. Set this for real use, for example
  # "/var/lib/xibalba/xibalba.key".
  key_file: ""
  # Name of the cookie that holds the pass.
  cookie_name: "xibalba-pass"

# The pages Xibalba itself shows to visitors: the security check, "request
# blocked" and "website unavailable". They work as they are; adapt them here if you want.
pages:
  # Who runs the website, as it should read in a sentence, for example
  # "Stadt Musterhausen". Empty keeps "The operator of this website".
  # Needs a sponsor license (see "license" below).
  operator: ""
  # How to reach you, shown on the block page, for example an e-mail address
  # or a telephone number. Empty shows no contact line.
  contact: ""
  # Language for visitors whose browser states none of the supported ones (de, en).
  default_language: de
  # Replace any text, per language. Needs a sponsor license.
  # {operator} stands for the operator. Example:
  #
  #   texts:
  #     de:
  #       operator: "Die Stadt Musterhausen"
  #       blocked_text: "{operator} erlaubt keine automatisierten Abrufe."
  #     en:
  #       operator: "The City of Musterhausen"
  #
  # The text names are listed in docs/CONFIGURATION.md.
  texts: {}
  # Show the line "Protected by Xibalba" with a link to the project at the
  # bottom of every page. Setting this to false needs a sponsor license.
  attribution: true

# Sponsor license. Xibalba is free and complete without one. Sponsors of the
# project receive a license file that lets them remove the "Protected by
# Xibalba" line and put their own name and wording on the pages
# (pages.operator, pages.texts, pages.attribution). See docs/SPONSORS.md.
license:
  # The license file, relative to this file. Empty: no license.
  file: ""

# Statistics kept on disk: how often each rule, crawler and limit counted,
# by the hour, across restarts. Counts only; no address, path or user agent
# is stored. See docs/STATISTICS.md.
statistics:
  # Directory for the files, relative to this file. It must exist and be
  # writable for Xibalba's user. Empty: nothing is kept across restarts.
  directory: ""
  # How many days an hour's counts are kept (1 to 3650).
  keep_days: 400
  # Counts per network of origin: which networks most requests came from, and
  # what happened to them. Off by default. A network is an IPv4 /24 (256
  # addresses) or an IPv6 /48; no single address is stored. Needs "directory".
  networks:
    enabled: false
    # How many networks are kept per hour. The rest is summed up as "other".
    top: 50
    # How many days these counts are kept (1 to 400). Keep them short: a
    # network is closer to a person than a rule name is.
    keep_days: 30

# What Xibalba writes to its log (standard error).
log:
  # Lowest severity that is written: debug, info, warn, error.
  level: info
  # json: one JSON object per line, for log collectors.
  # text: key=value lines, easier to read by eye.
  format: json

# Internal listener for health checks. Keep it off the public internet.
ops:
  # host:port to listen on. The default is reachable from this machine only.
  listen: "127.0.0.1:9090"

# Web interface: an overview of what Xibalba counted, in the browser. Optional
# and off by default; switched off, nothing listens and nothing is used.
# It only shows; settings stay in this file. See docs/ADMIN.md.
admin:
  # Set a password first:  xibalba -set-password -config xibalba.yaml
  enabled: false
  # host:port to listen on. The default is reachable from this machine only.
  # The connection is not encrypted: from another machine, use an SSH tunnel
  # or put a web server with HTTPS in front.
  listen: "127.0.0.1:9091"
  # File with the stored password (never the password itself), relative to
  # this file. Written by "xibalba -set-password".
  password_file: admin.password
  # How long a login lasts (5m to 720h).
  session_lifetime: 12h

# How long running requests get to finish when Xibalba is asked to stop.
shutdown_timeout: 10s
